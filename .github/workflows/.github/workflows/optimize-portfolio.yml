name: Optimize portfolio images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate thumbnail and lightbox WebP files
        shell: python
        run: |
          import base64, io, json, re
          from pathlib import Path
          from PIL import Image
          chunks = ["38-v7a00", "40-v7a01", "42-v7a02", "81-v7a03", "47-v7a04", "49-v7a05", "51-v7a06", "53-v7a07", "54-v7a08", "56-v7a09", "58-v7a10", "60-v7a11", "62-v7a12", "78-v7a13", "68-v7a14", "70-v7a15", "71-v7a16"]
          archive = ''.join(Path(name).read_text() for name in chunks)
          photos = re.findall(r'"data:image/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+"', archive)
          assert len(photos) == 101, f'Expected 101 source images, found {len(photos)}'
          out = Path('portfolio')
          out.mkdir(exist_ok=True)
          for number, photo in enumerate(photos, 1):
              image = Image.open(io.BytesIO(base64.b64decode(json.loads(photo).split(',')[1]))).convert('RGB')
              image.thumbnail((1200, 1200))
              image.save(out / f'photo-{number:03}-large.webp', quality=82, method=6)
              image.thumbnail((460, 460))
              image.save(out / f'photo-{number:03}-thumb.webp', quality=72, method=6)
          assert len(list(out.glob('*.webp'))) == 202
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio
          if ! git diff --staged --quiet; then
            git commit -m "Generate optimized portfolio thumbnails and separate lightbox images"
            git push
          fi
